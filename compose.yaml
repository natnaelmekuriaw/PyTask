services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pytask
      POSTGRES_USER: pytask
      POSTGRES_PASSWORD: pytask
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pytask -d pytask"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

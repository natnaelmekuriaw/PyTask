x-application: &application
  image: ${PYTASK_IMAGE:-pytask:local}
  build:
    context: .
    target: runtime
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &application-environment
    PYTASK_DATABASE_URL: ${PYTASK_CONTAINER_DATABASE_URL:-postgresql+psycopg://pytask:pytask@postgres:5432/pytask}
    PYTASK_LOG_LEVEL: ${PYTASK_LOG_LEVEL:-INFO}
    PYTASK_DB_POOL_SIZE: "2"
    PYTASK_DB_MAX_OVERFLOW: "0"
    PYTASK_DB_POOL_TIMEOUT: "5"
    PYTASK_DB_CONNECT_TIMEOUT: "5"
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pytask}
      POSTGRES_USER: ${POSTGRES_USER:-pytask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pytask}
    ports:
      - "127.0.0.1:${PYTASK_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

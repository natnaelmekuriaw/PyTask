name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pytask
          POSTGRES_USER: pytask
          POSTGRES_PASSWORD: pytask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pytask -d pytask"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      PYTASK_DATABASE_URL: postgresql+psycopg://pytask:pytask@localhost:5432/pytask
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints/runtime.txt -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints/runtime.txt -e ".[dev]"
      - run: pytest -q -m "not integration"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate service configuration
        run: docker compose --profile runtime --profile tools config --quiet
      - name: Build the runtime image
        run: docker build --target runtime --tag pytask:ci .
      - name: Check the image entry point
        run: docker run --rm --read-only --tmpfs /tmp pytask:ci --help
      - name: Check packaged key management
        run: docker run --rm --read-only --tmpfs /tmp --entrypoint python pytask:ci -m pytask_service.auth --help
      - name: Check packaged benchmark command
        run: docker run --rm --read-only --tmpfs /tmp --entrypoint python pytask:ci -m pytask_service.benchmarks --help
      - name: Check packaged migrations and runtime identity
        run: |
          docker run --rm -i --read-only --tmpfs /tmp --entrypoint python pytask:ci - <<'PY'
          import os
          from pathlib import Path
          from pytask_service.runtime.paths import RuntimePaths
          from pytask_service.runtime.schema import expected_heads
          assert os.getuid() == 10001
          assert Path('/app/LICENSE').is_file()
          assert expected_heads(RuntimePaths.from_env())
          print('image smoke checks passed')
          PY

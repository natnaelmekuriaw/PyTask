x-url-secret: &url-secret
  environment:
    PYTASK_DATABASE_URL: ""
    PYTASK_DATABASE_URL_FILE: /run/secrets/database_url
  secrets:
    - database_url

services:
  api:
    <<: *url-secret
  worker:
    <<: *url-secret
  scheduler:
    <<: *url-secret
  migrate:
    <<: *url-secret
  ops:
    <<: *url-secret
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

secrets:
  database_url:
    file: ${PYTASK_DATABASE_URL_SECRET_FILE:-./.secrets/database-url.txt}
  postgres_password:
    file: ${PYTASK_POSTGRES_PASSWORD_SECRET_FILE:-./.secrets/postgres-password.txt}
